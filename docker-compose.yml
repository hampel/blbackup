# One-shot container, driven by cron on the host. There is no long-running
# service here, so `docker compose run --rm` rather than `up`:
#
#   0 2 * * * cd /opt/blbackup && \
#             docker compose run --rm blbackup php blbackup cron >> /var/log/blbackup/cron.log 2>&1
#
# `cron` is the whole run - back up, download, move, expire - and the only
# command that posts a Slack run summary. Set LOCK_FILE in .env to a path under
# one of the mounts below, eg /logs/blbackup.lock: each `docker compose run`
# gets its own filesystem, so a lock left at its default inside the container is
# one two concurrent runs cannot see each other holding.
#
# Whether the downloads are moved to secondary storage is decided by
# RCLONE_REMOTE: set, and they are moved there and expired there; unset, and
# they stay on this machine. Nothing else changes.
#
# After any image rebuild:
#
#   docker compose run --rm blbackup php blbackup app:validate
#
# which runs each binary, lists the rclone remote and calls the API, and exits
# non-zero if the image cannot do what the configuration says.

services:
  blbackup:
    image: blbackup

    build:
      context: .
      args:
        # So the image knows what it is. Without it app:config says "unreleased"
        # and so does every Slack run summary, because there is no .git and no
        # git binary in the image for `git describe` to use:
        #
        #   VERSION=$(git describe --tags --abbrev=0) docker compose build
        #
        # app:validate warns when it was not passed.
        VERSION: ${VERSION:-}

    volumes:
      # Where downloaded backups land. HOST_DOWNLOAD_PATH in .env is the host
      # directory; DOWNLOAD_PATH must name the container side of this mount
      # (/downloads), not the host path - the app only ever sees the inside.
      #
      # Both host paths are REQUIRED rather than defaulted, deliberately. A
      # default would land multi-gigabyte images somewhere nobody chose, and
      # clean would then expire an empty directory while the real backups aged
      # forever - with the run succeeding and the summary posting. Unset, docker
      # compose refuses to start and names the variable, which cron reports.
      - "${HOST_DOWNLOAD_PATH:?set HOST_DOWNLOAD_PATH in .env to the host directory for backups}:/downloads"

      # LOG_STORAGE_PATH likewise, eg /logs/blbackup.log, with HOST_LOG_PATH the
      # host directory behind it. A path that is not under a mount is written
      # into the container and lost when it exits - and if the directory cannot
      # be written at all, every command dies on its first API call, because
      # App\Api logs every call.
      - "${HOST_LOG_PATH:?set HOST_LOG_PATH in .env to the host directory for logs}:/logs"

      # Read-only: the container has no business rewriting its own settings.
      - ./.env:/app/.env:ro

      # NOT read-only. rclone rewrites this file when it refreshes an OAuth
      # token, so a remote on Google Drive, Dropbox or OneDrive stops working
      # after the current token expires if this is mounted :ro.
      - ./rclone.conf:/root/.config/rclone/rclone.conf

      # Server lists. Name the container side in .env - EXCLUDE_FILE=/app/exclude.txt
      # - rather than passing --exclude on the crontab line: a path that only
      # appears in cron cannot be shown by app:config or checked by app:validate,
      # so nothing tells you it is wrong until a run fails on it, and nothing at
      # all tells you an emptied list has quietly stopped filtering.
      - ./exclude.txt:/app/exclude.txt:ro
