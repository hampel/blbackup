# Actions are pinned to full-length commit SHAs because this repository requires
# it - a version tag is a moving target that the action's owner can repoint at
# any commit, and a workflow with repository write access is a bad place for
# that. The comment beside each SHA is the release it was taken from; to update
# one, resolve the tag again rather than replacing the SHA with the tag.
#
#   git ls-remote --tags https://github.com/actions/checkout | grep 'v7.0.1$'
#
# An annotated tag needs the dereferenced line - refs/tags/x^{} - which is the
# commit; the bare line is the tag object and will not be accepted.

name: ci

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
  workflow_dispatch:

# One run per branch or PR. A push that lands while an earlier one is still
# going makes the earlier one irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; the release job widens this for itself alone.
permissions:
  contents: read

jobs:
  tests:
    name: tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.3 is the floor composer.json declares and what the container runs.
        # Nothing runs this tool on anything newer yet; add a version here when
        # something does, rather than testing a platform nobody deploys on.
        php: ['8.3']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: php vendor/bin/pest

  container:
    name: container image
    runs-on: ubuntu-latest

    # This job is the reason this file exists. The Dockerfile had never been
    # built anywhere but the production server, so its first execution was
    # always on the machine that takes the backups - and two defects reached it
    # that way: rclone installed somewhere the configured path did not point,
    # and a missing /app/storage that made every rclone call refuse to start.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        # VERSION is how the image is told what it is: there is no .git and no
        # git binary inside, so app.version would otherwise fall back to
        # "unreleased" - which app:config reports and every Slack run summary is
        # signed with.
        run: docker build --build-arg VERSION=ci-version-check -t blbackup:ci .

      - name: The machine can do what the configuration says
        # --no-api keeps this off the BinaryLane API, so it needs no credentials
        # - and still runs every binary, takes the lock, probes the download path
        # and writes a real log record at every level. The token is only checked
        # for presence, never used.
        #
        # Deliberately --no-api rather than --offline, and deliberately not
        # --unattended. Both of those suppress the level sweep, and this job is
        # the only place it is ever written inside the image - which is most of
        # the point of running the command in there at all. Nothing is posted
        # because no webhook is configured: .dockerignore keeps .env out of the
        # image and LOG_STACK is a single file below. --no-api has never been
        # what kept this off Slack, whatever its old comment here claimed.
        #
        # This is why --no-api survives as its own flag rather than being renamed
        # into --offline: it is the one combination --offline cannot express.
        run: |
          docker run --rm \
            -e BINARYLANE_API_TOKEN=ci-token-never-used \
            -e LOG_STACK=single \
            -e LOG_STORAGE_PATH=/tmp/blbackup.log \
            -e LOG_HOSTNAME=ci \
            blbackup:ci php blbackup app:validate --no-api

      - name: Regressions this image has had
        run: |
          # rclone is installed by hand to /usr/local/bin, but RCLONE_BINARY
          # defaults to /usr/bin/rclone - both have to work
          docker run --rm blbackup:ci /usr/bin/rclone --version

          # .dockerignore excludes /storage on purpose; the empty directory
          # still has to exist, because every rclone call runs from there and
          # Symfony's Process will not start when its cwd does not
          docker run --rm blbackup:ci test -d /app/storage

          # the build argument reached app.version, rather than the image
          # quietly calling itself "unreleased"
          docker run --rm blbackup:ci php blbackup app:config --only=application \
            | grep -q 'ci-version-check'

          # a mistyped command must exit non-zero: this tool's exit code is the
          # whole of what cron reads
          if docker run --rm blbackup:ci php blbackup app:validte; then
            echo 'A mistyped command exited 0'
            exit 1
          fi

  build:
    name: compiled binary
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # app:build takes its version from `git describe`, so the tags have
          # to be here or the artefact announces itself as "unreleased"
          fetch-depth: 0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: intl
          coverage: none
          # box writes a phar, which php refuses to do by default
          ini-values: phar.readonly=0

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Compile
        # composer build installs --no-dev, compiles, restores, and then fails
        # if laravel/pint is still findable in the artefact. app:build never
        # runs composer and box.json takes vendor/ wholesale, so building from
        # a dev checkout compiles pint, phpunit, pest and mockery into the
        # binary - 29 MB of a 29 MB artefact, and nothing noticed for a while
        run: composer build

      - name: It runs, and knows what it is
        run: |
          ./builds/blbackup --version
          ./builds/blbackup list > /dev/null

  release:
    name: publish the release
    runs-on: ubuntu-latest

    # Only a tag publishes, and only after everything else has passed. A binary
    # that other people download is not the place to find out the suite was red.
    needs: [tests, container, build]
    if: startsWith(github.ref, 'refs/tags/')

    # The only job that may write to the repository, and it says so here rather
    # than at the top of the file.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # app:build takes its version from `git describe --tags`, so without
          # the history the release would announce itself as "unreleased"
          fetch-depth: 0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: intl
          coverage: none
          # box writes a phar, which php refuses to do by default
          ini-values: phar.readonly=0

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Compile
        # Compiled here rather than carried over from the build job. Passing the
        # artefact between jobs would publish the exact binary that was smoke
        # tested, which is the better property - but it costs two more actions to
        # pin and keep current, and the same commit compiles to the same thing.
        # The checks below are the ones that job runs, repeated on what ships.
        run: composer build

      - name: It runs, and announces the tag it was built from
        # The trap this guards: config/app.php holds `app('git.version')`, and
        # app:build evaluates that file on the build machine and compiles the
        # result in as a literal. Build before tagging and the binary ships
        # announcing the previous release, with nothing to show it is wrong.
        run: |
          ./builds/blbackup list > /dev/null

          built=$(./builds/blbackup --version | awk '{print $NF}')

          if [ "$built" != "$GITHUB_REF_NAME" ]; then
            echo "The binary says [$built] but the tag is [$GITHUB_REF_NAME]."
            exit 1
          fi

          echo "$built"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd builds && sha256sum blbackup > blbackup.sha256)

          # The hand-written entry for this version, which is worth more than
          # anything generated from the commits. Falls back to generated notes
          # rather than failing the release if the section is missing.
          awk -v tag="$GITHUB_REF_NAME" '
            $0 ~ "^## \\[" tag "\\]" { found = 1; next }
            found && /^## / { exit }
            found && /^\[.*\]: http/ { exit }
            found { print }
          ' CHANGELOG.md > body.md

          {
            echo "Needs PHP 8.3 or newer with ext-intl. Download, \`chmod +x\`,"
            echo "and put a \`.env\` beside the binary - see \`.env.example\`."
            echo "Verify with \`sha256sum -c blbackup.sha256\`."
            echo
          } | cat - body.md > notes.md

          if [ ! -s body.md ]; then
            gh release create "$GITHUB_REF_NAME" \
              builds/blbackup builds/blbackup.sha256 \
              --title "$GITHUB_REF_NAME" --verify-tag --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" \
              builds/blbackup builds/blbackup.sha256 \
              --title "$GITHUB_REF_NAME" --verify-tag --notes-file notes.md
          fi
